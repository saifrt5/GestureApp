name: Build APK (Python + Mediapipe + OpenCV + Pygame)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.10

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip build-essential \
            libffi-dev libssl-dev libsqlite3-dev zlib1g-dev libjpeg-dev libpng-dev \
            libusb-1.0-0-dev libtiff-dev libgles2-mesa-dev libgl1-mesa-dev

      - name: Install Python packages
        run: |
          pip install --upgrade pip Cython
          pip install buildozer opencv-python mediapipe pygame

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gesture-control-apk
          path: bin/*.apk
