name: Build Python Gesture APK (OpenCV + Mediapipe + Pygame)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"

jobs:
  build-apk:
    name: Build APK using Buildozer
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: ⚙️ Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip libffi-dev libssl-dev \
            libsqlite3-dev zlib1g-dev libjpeg-dev libpng-dev libusb-1.0-0-dev \
            libtiff-dev libgles2-mesa-dev libgl1-mesa-dev

      - name: 📦 Install Buildozer & Dependencies
        run: |
          python -m pip install --upgrade pip Cython
          pip install buildozer opencv-python mediapipe pygame

      - name: 🧰 Initialize Buildozer if missing
        run: |
          if [ ! -f "buildozer.spec" ]; then
            buildozer init
          fi

      - name: 🛠️ Build APK
        run: |
          buildozer -v android debug

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-gesture-apk
          path: bin/*.apk
