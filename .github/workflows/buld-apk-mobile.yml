name: Build Python Gesture App (OpenCV + Mediapipe + Pygame)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"

jobs:
  build-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: ⚙️ Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender1 ffmpeg

      - name: 📦 Install Python libraries
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python mediapipe pygame

      - name: ✅ Test the Python script
        run: |
          python gesture_app.py  # غيّر الاسم لو ملفك مختلف (مثلاً main.py)

      - name: 📁 Upload build logs
        uses: actions/upload-artifact@v4
        with:
          name: python-gesture-logs
          path: .
          if-no-files-found: ignore

  build-windows:
    name: Build EXE (Windows)
    runs-on: windows-latest

    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python mediapipe pygame pyinstaller

      - name: 🏗️ Build EXE file
        run: |
          pyinstaller --onefile --noconsole gesture_app.py  # غيّر الاسم لو ملفك مختلف

      - name: 📤 Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/
